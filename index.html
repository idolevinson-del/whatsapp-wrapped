<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <!-- PWA: "Add to Home Screen" support. The web manifest (injected by
         vite-plugin-pwa) covers Android/Chrome; Safari on iOS ignores the
         manifest for icon/status-bar purposes and needs these explicitly. -->
    <link rel="apple-touch-icon" href="/pwa-icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wrapped" />

    <title>WhatsApp Wrapped — Discover who REALLY runs your group 😂</title>
    <meta
      name="description"
      content="Upload a WhatsApp chat export and find out who talks the most, who's the funniest, and who never replies — a fun, private stats breakdown. Everything happens on your device."
    />

    <!-- Open Graph / WhatsApp / Facebook link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WhatsApp Wrapped" />
    <meta property="og:title" content="WhatsApp Wrapped — Discover who REALLY runs your group 😂" />
    <meta
      property="og:description"
      content="Upload a WhatsApp chat export and find out who talks the most, who's the funniest, and who never replies — a fun, private stats breakdown."
    />
    <meta property="og:image" content="https://whatsapp-wrapped-ruddy.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://whatsapp-wrapped-ruddy.vercel.app/" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="WhatsApp Wrapped — Discover who REALLY runs your group 😂" />
    <meta
      name="twitter:description"
      content="Upload a WhatsApp chat export and find out who talks the most, who's the funniest, and who never replies — a fun, private stats breakdown."
    />
    <meta name="twitter:image" content="https://whatsapp-wrapped-ruddy.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
